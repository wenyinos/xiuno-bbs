<?php if( $till_theme_nekoha_shizuku_setting['threadlist_ajax'] ): ?>
<script>
    $('#loadmore').click(function () {
        $this = $(this);
        $this.addClass('loading'); //给a标签加载一个loading的class属性，用来添加加载效果
        var href = $this.attr('href'); //获取下一页的链接地址
        if (href != undefined) { //如果地址存在
            $.ajax({ //发起ajax请求
                url: href,
                //请求的地址就是下一页的链接
                type: 'get',
                //请求类型是get
                error: function (request) {
                    //如果发生错误怎么处理
                },
                success: function (data) { //请求成功
                    $this.removeClass('loading'); //移除loading属性
                    var $res = $(data).find('.media.thread'); //从数据中挑出文章数据，请根据实际情况更改
                    //$('.threadlist').append($res.fadeIn(500)); //将数据加载加进posts-loop的标签中。
                    $res.insertBefore($('.loadmore-container')); //将数据加载加进posts-loop的标签中。
                    var newhref = $(data).find('#loadmore').attr('href'); //找出新的下一页链接
                    if (newhref != undefined) {
                        $('#loadmore').attr('href', newhref);
                    } else {
                        $('#loadmore').remove(); //如果没有下一页了，隐藏
                    }
                }
            });
        }
        return false;
    });

</script>
<?php endif; ?>
